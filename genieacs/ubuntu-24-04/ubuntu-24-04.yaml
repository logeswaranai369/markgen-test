- name: GenieACS Setup
  hosts: localhost
  tasks:
      - name: Restarting sshd
        shell: "sed -i 's/#Match User anoncvs/ForceCommand echo Please wait until the installation is completed..../g' /etc/ssh/sshd_config && (systemctl restart ssh 2>/dev/null || systemctl restart sshd)"

      - name: Install and configure GenieACS
        block:
          # On a freshly-booted Ubuntu the apt/dpkg lock is held by cloud-init's boot-time
          # `unattended-upgrades`/apt.systemd.daily. The first package task races it and fails with
          # "Could not get lock /var/lib/dpkg/lock-frontend ... held by process N (unattended-upgr)".
          # STOP the apt-daily timers/services FIRST so they cannot re-acquire the lock mid-run — a
          # one-shot wait isn't enough for long installs (GitLab/BBB/desktop, ~20-40 min): the timer
          # fires again during the install and kills a later apt task with rc=100 (hit live on Ubuntu
          # Desktop). Then block until any in-progress lock clears before installing.
          - name: Stop apt-daily timers/services so they can't grab the dpkg lock mid-install
            shell: |
              systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
              systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
              systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
              exit 0
            changed_when: false

          - name: Await release of the apt/dpkg lock (boot-time unattended-upgrades)
            shell: |
              for i in $(seq 1 60); do
                fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1 || exit 0
                sleep 10
              done
              exit 0
            changed_when: false

          - name: Updating Packages
            ansible.builtin.apt:
              update_cache: yes
              lock_timeout: 300

          - name: Generating genieacs_ui_jwt_secret
            shell: openssl rand -hex 24
            register: genieacs_ui_jwt_secret

          - name: Storing genieacs_ui_jwt_secret
            copy:
              dest: "/root/.genieacs_ui_jwt_secret"
              content: |
                genieacs_ui_jwt_secret = "{{ genieacs_ui_jwt_secret.stdout }}"
          - name: Generating genieacs_admin_password
            shell: openssl rand -hex 24
            register: genieacs_admin_password

          - name: Storing genieacs_admin_password
            copy:
              dest: "/root/.genieacs_admin_password"
              content: |
                genieacs_admin_password = "{{ genieacs_admin_password.stdout }}"

          # Guaranteed operator credentials file (Plan 20 M3). Written from the AppSpec (generated
          # secrets + access endpoints) so it ALWAYS exists — the deploy report found apps that
          # shipped with none. Runs BEFORE the app tasks, so an app that wants a richer file (admin
          # username, exact login path) may overwrite /home/ubuntu/credentials.txt afterwards.
          - name: Write deployment credentials to /home/ubuntu/credentials.txt (scaffold-guaranteed)
            copy:
              dest: /home/ubuntu/credentials.txt
              owner: ubuntu
              group: ubuntu
              mode: '0600'
              content: |
                ============================================================
                 GenieACS - deployment credentials
                ============================================================
                Generated automatically at deploy time. Keep this file secure.
                Replace <server-ip> with this VM's public IP address.

                Access:
                  Service : genieacs-cwmp
                  Service : genieacs-nbi
                  Service : genieacs-fs
                  Service : genieacs-ui
                  Port    : 3000
                  Port    : 7557
                  URL     : http://<server-ip>:3000/

                Credentials:
                  genieacs ui jwt secret : {{ genieacs_ui_jwt_secret.stdout }}
                  genieacs admin password : {{ genieacs_admin_password.stdout }}

                Notes:
                  Log in to the UI at http://<PUBLIC_IP>:3000/ with the seeded admin user. TLS is disabled by default (plain HTTP on all services); enable CWMP/UI SSL via GENIEACS_*_SSL_CERT/KEY for production. MongoDB stays bound to 127.0.0.1 (local, correct — GenieACS talks to it locally).


          # ----- BEGIN app-specific tasks (LLM-generated from AppSpec) -----
          - name: Install prerequisite packages
            apt:
              name:
                - gnupg
                - curl
                - ca-certificates
              state: latest
              lock_timeout: 300

          - name: Add MongoDB 8.0 GPG key (dearmored keyring)
            shell: |
              set -o pipefail
              curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
                | gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
            args:
              executable: /bin/bash
              creates: /usr/share/keyrings/mongodb-server-8.0.gpg

          - name: Add MongoDB 8.0 apt repository (codename derived from this release)
            apt_repository:
              repo: "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu {{ ansible_distribution_release }}/mongodb-org/8.0 multiverse"
              filename: mongodb-org-8.0
              state: present

          - name: Debug - installing MongoDB
            debug:
              msg: "Installing MongoDB 8.0 server packages"

          - name: Install MongoDB server
            apt:
              name: mongodb-org
              state: latest
              update_cache: yes
              lock_timeout: 300

          - name: Ensure MongoDB is enabled and running (bound to localhost, correct for GenieACS)
            service:
              name: mongod
              enabled: yes
              state: started

          - name: Debug - setting up Node.js
            debug:
              msg: "Setting up NodeSource Node.js 20.x repository and installing Node.js"

          - name: Add NodeSource Node.js 20.x repository
            shell: |
              set -o pipefail
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            args:
              executable: /bin/bash
              creates: /etc/apt/sources.list.d/nodesource.list

          - name: Install Node.js (includes npm)
            apt:
              name: nodejs
              state: latest
              update_cache: yes
              lock_timeout: 300

          - name: Debug - installing GenieACS via npm
            debug:
              msg: "Installing genieacs@1.2.16 globally with prefix /usr/local"

          - name: Check if GenieACS is already installed
            stat:
              path: /usr/local/bin/genieacs-cwmp
            register: genieacs_bin

          - name: Install GenieACS globally (prefix /usr/local so binaries land in /usr/local/bin)
            command: npm install -g --prefix /usr/local genieacs@1.2.16
            when: not genieacs_bin.stat.exists

          - name: Debug - creating genieacs system user and directories
            debug:
              msg: "Creating genieacs user, /opt/genieacs and /var/log/genieacs"

          - name: Create genieacs system group
            group:
              name: genieacs
              system: yes

          - name: Create genieacs system user
            user:
              name: genieacs
              group: genieacs
              system: yes
              shell: /usr/sbin/nologin
              home: /opt/genieacs
              create_home: no

          - name: Create GenieACS directories
            file:
              path: "{{ item }}"
              state: directory
              owner: genieacs
              group: genieacs
              mode: '0755'
            loop:
              - /opt/genieacs
              - /opt/genieacs/ext
              - /var/log/genieacs

          - name: Debug - writing GenieACS environment file
            debug:
              msg: "Writing /opt/genieacs/genieacs.env with generated JWT secret and 0.0.0.0 bindings"

          - name: Write GenieACS environment file (contains generated JWT secret)
            copy:
              dest: /opt/genieacs/genieacs.env
              owner: genieacs
              group: genieacs
              mode: '0600'
              content: |
                GENIEACS_CWMP_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-cwmp-access.log
                GENIEACS_NBI_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-nbi-access.log
                GENIEACS_FS_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-fs-access.log
                GENIEACS_UI_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-ui-access.log
                GENIEACS_DEBUG_FILE=/var/log/genieacs/genieacs-debug.yaml
                NODE_OPTIONS=--enable-source-maps
                GENIEACS_EXT_DIR=/opt/genieacs/ext
                GENIEACS_CWMP_INTERFACE=0.0.0.0
                GENIEACS_NBI_INTERFACE=0.0.0.0
                GENIEACS_FS_INTERFACE=0.0.0.0
                GENIEACS_UI_INTERFACE=0.0.0.0
                GENIEACS_UI_JWT_SECRET={{ genieacs_ui_jwt_secret.stdout }}

          - name: Debug - installing systemd units
            debug:
              msg: "Writing systemd units for genieacs-cwmp/nbi/fs/ui"

          - name: Write GenieACS systemd units
            copy:
              dest: "/etc/systemd/system/genieacs-{{ item.svc }}.service"
              mode: '0644'
              content: |
                [Unit]
                Description=GenieACS {{ item.desc }}
                After=network.target mongod.service

                [Service]
                User=genieacs
                EnvironmentFile=/opt/genieacs/genieacs.env
                ExecStart=/usr/local/bin/genieacs-{{ item.svc }}

                [Install]
                WantedBy=default.target
            loop:
              - { svc: cwmp, desc: CWMP }
              - { svc: nbi,  desc: NBI }
              - { svc: fs,   desc: FS }
              - { svc: ui,   desc: UI }

          - name: Write logrotate config for GenieACS
            copy:
              dest: /etc/logrotate.d/genieacs
              mode: '0644'
              content: |
                /var/log/genieacs/*.log /var/log/genieacs/*.yaml {
                    daily
                    rotate 30
                    compress
                    delaycompress
                    dateext
                }

          - name: Debug - writing admin seed script
            debug:
              msg: "Writing /opt/genieacs/seed-admin.js"

          - name: Write admin seed script
            copy:
              dest: /opt/genieacs/seed-admin.js
              owner: genieacs
              group: genieacs
              mode: '0644'
              content: |
                const crypto = require('crypto');
                const { MongoClient } = require('mongodb');
                const username = process.argv[2];
                const password = process.argv[3];
                const resources = ['devices','faults','files','presets','provisions','config','permissions','users','virtualParameters'];
                (async () => {
                  const client = new MongoClient('mongodb://127.0.0.1:27017/genieacs');
                  await client.connect();
                  const db = client.db('genieacs');
                  const salt = crypto.randomBytes(64).toString('hex');
                  const hash = crypto.pbkdf2Sync(password, salt, 10000, 128, 'sha512').toString('hex');
                  await db.collection('users').updateOne(
                    { _id: username },
                    { $set: { password: hash, salt: salt, roles: 'admin' } },
                    { upsert: true }
                  );
                  for (const r of resources) {
                    await db.collection('permissions').updateOne(
                      { _id: 'admin:' + r + ':3' },
                      { $set: { role: 'admin', resource: r, access: 3, filter: 'true', validate: 'true' } },
                      { upsert: true }
                    );
                  }
                  await client.close();
                  console.log('Seed complete');
                })().catch(e => { console.error(e); process.exit(1); });

          - name: Reload systemd to pick up new units
            systemd:
              daemon_reload: yes

          - name: Debug - seeding admin user into MongoDB
            debug:
              msg: "Seeding UI admin user + admin role permissions (idempotent upsert)"

          - name: Seed GenieACS admin user (uses mongodb driver bundled with genieacs)
            command: node /opt/genieacs/seed-admin.js admin '{{ genieacs_admin_password.stdout }}'
            environment:
              NODE_PATH: /usr/local/lib/node_modules/genieacs/node_modules
            register: seed_result
            changed_when: "'Seed complete' in seed_result.stdout"

          - name: Debug - enabling and starting GenieACS services
            debug:
              msg: "Enabling and starting genieacs-cwmp/nbi/fs/ui"

          - name: Enable and start GenieACS services
            service:
              name: "genieacs-{{ item }}"
              enabled: yes
              state: started
            loop:
              - cwmp
              - nbi
              - fs
              - ui

          - name: Write credentials file for operator
            copy:
              dest: /home/ubuntu/credentials.txt
              owner: ubuntu
              group: ubuntu
              mode: '0600'
              content: |
                GenieACS Web UI: http://<PUBLIC_IP>:3000/
                Admin username: admin
                Admin password: {{ genieacs_admin_password.stdout }}

                TR-069 CWMP endpoint: http://<PUBLIC_IP>:7547/
                Northbound API (NBI): http://<PUBLIC_IP>:7557/
                File Server (FS):     http://<PUBLIC_IP>:7567/
          # ----- END app-specific tasks -----

          - name: Creating /opt/cloudstack directory
            ansible.builtin.file:
              path: /opt/cloudstack
              state: directory

          - name: Copy cleanup + update helper scripts
            copy:
              src: "{{ item.confsrc }}"
              dest: "{{ item.confdest }}"
            with_items:
              - { confsrc: '/usr/local/src/ubuntu-24-04/opt/cloudstack/ubuntu-24-04_cleanup.sh', confdest: '/opt/cloudstack/'}
              - { confsrc: '/usr/local/src/ubuntu-24-04/opt/cloudstack/ubuntu-24-04_update.sh', confdest: '/opt/cloudstack/'}

          - name: Wire cleanup script to run on first login
            lineinfile:
              path: /root/.bashrc
              line: "chmod +x /opt/cloudstack/ubuntu-24-04_cleanup.sh && /opt/cloudstack/ubuntu-24-04_cleanup.sh"
              state: present
        always:
          - name: Restarting sshd
            shell: "sed -i 's/ForceCommand echo Please wait until the installation is completed..../#Match User anoncvs/g' /etc/ssh/sshd_config && (systemctl restart ssh 2>/dev/null || systemctl restart sshd)"
