- name: GenieACS Setup
  hosts: localhost
  tasks:
      - name: Restarting sshd
        shell: "sed -i 's/#Match User anoncvs/ForceCommand echo Please wait until the installation is completed..../g' /etc/ssh/sshd_config && (systemctl restart ssh 2>/dev/null || systemctl restart sshd)"

      - name: Install and configure GenieACS
        block:
          # On a freshly-booted Ubuntu the apt/dpkg lock is held by cloud-init's boot-time
          # `unattended-upgrades`/apt.systemd.daily. The first package task races it and fails with
          # "Could not get lock /var/lib/dpkg/lock-frontend ... held by process N (unattended-upgr)".
          # STOP the apt-daily timers/services FIRST so they cannot re-acquire the lock mid-run — a
          # one-shot wait isn't enough for long installs (GitLab/BBB/desktop, ~20-40 min): the timer
          # fires again during the install and kills a later apt task with rc=100 (hit live on Ubuntu
          # Desktop). Then block until any in-progress lock clears before installing.
          - name: Stop apt-daily timers/services so they can't grab the dpkg lock mid-install
            shell: |
              systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
              systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
              systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
              exit 0
            changed_when: false

          - name: Await release of the apt/dpkg lock (boot-time unattended-upgrades)
            shell: |
              for i in $(seq 1 60); do
                fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1 || exit 0
                sleep 10
              done
              exit 0
            changed_when: false

          - name: Updating Packages
            ansible.builtin.apt:
              update_cache: yes
              lock_timeout: 300

          - name: Generating genieacs_ui_jwt_secret
            shell: openssl rand -hex 24
            register: genieacs_ui_jwt_secret

          - name: Storing genieacs_ui_jwt_secret
            copy:
              dest: "/root/.genieacs_ui_jwt_secret"
              content: |
                genieacs_ui_jwt_secret = "{{ genieacs_ui_jwt_secret.stdout }}"
          - name: Generating genieacs_admin_password
            shell: openssl rand -hex 24
            register: genieacs_admin_password

          - name: Storing genieacs_admin_password
            copy:
              dest: "/root/.genieacs_admin_password"
              content: |
                genieacs_admin_password = "{{ genieacs_admin_password.stdout }}"

          # Guaranteed operator credentials file (Plan 20 M3). Written from the AppSpec (generated
          # secrets + access endpoints) so it ALWAYS exists — the deploy report found apps that
          # shipped with none. Runs BEFORE the app tasks, so an app that wants a richer file (admin
          # username, exact login path) may overwrite /home/ubuntu/credentials.txt afterwards.
          - name: Write deployment credentials to /home/ubuntu/credentials.txt (scaffold-guaranteed)
            copy:
              dest: /home/ubuntu/credentials.txt
              owner: ubuntu
              group: ubuntu
              mode: '0600'
              content: |
                ============================================================
                 GenieACS - deployment credentials
                ============================================================
                Generated automatically at deploy time. Keep this file secure.
                Replace <server-ip> with this VM's public IP address.

                Access:
                  Service : genieacs-cwmp
                  Service : genieacs-nbi
                  Service : genieacs-fs
                  Service : genieacs-ui
                  Port    : 3000
                  Port    : 7557
                  URL     : http://<server-ip>:3000/

                Credentials:
                  genieacs ui jwt secret : {{ genieacs_ui_jwt_secret.stdout }}
                  genieacs admin password : {{ genieacs_admin_password.stdout }}

                Notes:
                  GenieACS UI has NO authentication until a user exists (empty users collection = full open admin) — this build hardens it by seeding an admin login + admin-role permissions. MongoDB stays on 127.0.0.1 (local backend, correct); all four GenieACS services bind 0.0.0.0. Node 20 (NodeSource) + MongoDB 8.0 (only noble build) verified with GenieACS 1.2.16's bundled mongodb driver 4.16. Seed script needs NODE_PATH=/usr/local/lib/node_modules/genieacs/node_modules and mongod running. All steps idempotent (npm guarded by creates, seed uses upsert).


          # ----- BEGIN app-specific tasks (LLM-generated from AppSpec) -----
          - name: Install base prerequisite packages
            apt:
              name:
                - curl
                - gnupg
                - ca-certificates
                - apt-transport-https
              state: latest
              lock_timeout: 300

          - name: Add NodeSource GPG key (Node 20 LTS)
            shell: |
              curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
            args:
              creates: /usr/share/keyrings/nodesource.gpg

          - name: Add NodeSource apt repository
            apt_repository:
              repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main"
              filename: nodesource
              state: present
              update_cache: yes

          - name: Add MongoDB 8.0 GPG key
            shell: |
              curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
            args:
              creates: /usr/share/keyrings/mongodb-server-8.0.gpg

          # MongoDB 8.0 publishes per-release builds (jammy/noble/...). Pick the codename at runtime
          # from the gathered facts so this ONE playbook works across Ubuntu versions.
          - name: Add MongoDB 8.0 apt repository (per-release codename)
            apt_repository:
              repo: "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu {{ ansible_distribution_release }}/mongodb-org/8.0 multiverse"
              filename: mongodb-org-8.0
              state: present
              update_cache: yes

          - name: Install Node.js 20
            debug:
              msg: "Installing Node.js 20 from NodeSource"

          - name: Install Node.js runtime
            apt:
              name: nodejs
              state: latest
              lock_timeout: 300

          - name: Install MongoDB server
            debug:
              msg: "Installing MongoDB 8.0"

          - name: Install MongoDB packages
            apt:
              name: mongodb-org
              state: latest
              lock_timeout: 300

          - name: Ensure mongod is enabled and running
            service:
              name: mongod
              state: started
              enabled: yes

          - name: Wait for MongoDB to accept connections
            wait_for:
              host: 127.0.0.1
              port: 27017
              timeout: 120

          - name: Install GenieACS via npm
            debug:
              msg: "Installing GenieACS 1.2.16 globally under /usr/local"

          - name: Install GenieACS (npm global, pinned version)
            command: npm install -g --prefix /usr/local genieacs@1.2.16
            args:
              creates: /usr/local/lib/node_modules/genieacs

          - name: Create genieacs system group
            group:
              name: genieacs
              system: yes

          - name: Create genieacs system user
            user:
              name: genieacs
              group: genieacs
              system: yes
              shell: /usr/sbin/nologin
              home: /opt/genieacs
              create_home: no

          - name: Create GenieACS directories
            file:
              path: "{{ item }}"
              state: directory
              owner: genieacs
              group: genieacs
              mode: '0755'
            loop:
              - /opt/genieacs
              - /opt/genieacs/ext
              - /var/log/genieacs

          - name: Write GenieACS runtime environment file (with real JWT secret)
            debug:
              msg: "Writing /opt/genieacs/genieacs.env with generated JWT secret; all interfaces bind 0.0.0.0"

          - name: Deploy genieacs.env
            copy:
              dest: /opt/genieacs/genieacs.env
              owner: genieacs
              group: genieacs
              mode: '0600'
              content: |
                GENIEACS_MONGODB_CONNECTION_URL=mongodb://127.0.0.1/genieacs
                GENIEACS_EXT_DIR=/opt/genieacs/ext
                GENIEACS_UI_JWT_SECRET={{ genieacs_ui_jwt_secret.stdout }}
                GENIEACS_CWMP_INTERFACE=0.0.0.0
                GENIEACS_NBI_INTERFACE=0.0.0.0
                GENIEACS_FS_INTERFACE=0.0.0.0
                GENIEACS_UI_INTERFACE=0.0.0.0
                GENIEACS_CWMP_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-cwmp-access.log
                GENIEACS_NBI_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-nbi-access.log
                GENIEACS_FS_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-fs-access.log
                GENIEACS_UI_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-ui-access.log

          - name: Deploy admin seeder script
            copy:
              dest: /opt/genieacs/seed-admin.js
              owner: genieacs
              group: genieacs
              mode: '0644'
              content: |
                "use strict";
                const crypto = require("crypto");
                const { MongoClient } = require("mongodb");
                const fs = require("fs");

                const MONGO = process.env.GENIEACS_MONGODB_CONNECTION_URL || "mongodb://127.0.0.1/genieacs";
                const raw = fs.readFileSync("/root/.genieacs_admin_password", "utf8").trim();
                const m = raw.match(/=\s*"(.*)"\s*$/);
                const password = m ? m[1] : raw;

                const RESOURCES = ["devices","faults","files","presets","provisions","config","permissions","users","virtualParameters"];

                function hash(pw, salt) {
                  return new Promise((res, rej) => {
                    crypto.pbkdf2(pw, salt, 10000, 128, "sha512", (e, d) => e ? rej(e) : res(d.toString("hex")));
                  });
                }

                (async () => {
                  const salt = crypto.randomBytes(64).toString("hex");
                  const pwHash = await hash(password, salt);
                  const client = await MongoClient.connect(MONGO);
                  const db = client.db();
                  await db.collection("users").replaceOne(
                    { _id: "admin" },
                    { _id: "admin", password: pwHash, salt: salt, roles: "admin" },
                    { upsert: true }
                  );
                  for (const r of RESOURCES) {
                    const _id = `admin:${r}:3`;
                    await db.collection("permissions").replaceOne(
                      { _id },
                      { _id, role: "admin", resource: r, access: 3, validate: "true" },
                      { upsert: true }
                    );
                  }
                  await client.close();
                  console.log("Seeded admin user + permissions");
                })().catch(e => { console.error(e); process.exit(1); });

          - name: Deploy systemd units for all four GenieACS services
            debug:
              msg: "Creating systemd units for genieacs-cwmp/nbi/fs/ui"

          - name: Write GenieACS systemd unit files
            copy:
              dest: "/etc/systemd/system/genieacs-{{ item }}.service"
              mode: '0644'
              content: |
                [Unit]
                Description=GenieACS {{ item }}
                After=network.target mongod.service
                Wants=mongod.service

                [Service]
                User=genieacs
                Group=genieacs
                EnvironmentFile=/opt/genieacs/genieacs.env
                ExecStart=/usr/local/bin/genieacs-{{ item }}
                Restart=always

                [Install]
                WantedBy=multi-user.target
            loop:
              - cwmp
              - nbi
              - fs
              - ui

          - name: Reload systemd to pick up new units
            systemd:
              daemon_reload: yes

          - name: Seed admin user + permissions (idempotent upsert; hardens the open UI)
            debug:
              msg: "Seeding GenieACS admin login so the UI is not left wide open"

          - name: Run the admin seeder
            command: node /opt/genieacs/seed-admin.js
            environment:
              NODE_PATH: /usr/local/lib/node_modules/genieacs/node_modules
              GENIEACS_MONGODB_CONNECTION_URL: mongodb://127.0.0.1/genieacs
            register: seed_result
            changed_when: "'Seeded' in seed_result.stdout"

          - name: Enable and start all GenieACS services
            service:
              name: "genieacs-{{ item }}"
              state: started
              enabled: yes
            loop:
              - cwmp
              - nbi
              - fs
              - ui

          - name: Write operator credentials file
            copy:
              dest: /home/ubuntu/credentials.txt
              owner: ubuntu
              group: ubuntu
              mode: '0600'
              content: |
                GenieACS Web UI
                URL: http://<server-ip>:3000/
                Admin username: admin
                Admin password: {{ genieacs_admin_password.stdout }}

                Ports: UI 3000, CWMP/TR-069 7547, NBI 7557, FS 7567
                MongoDB: mongodb://127.0.0.1/genieacs (local backend)
          # ----- END app-specific tasks -----

          - name: Creating /opt/cloudstack directory
            ansible.builtin.file:
              path: /opt/cloudstack
              state: directory

          - name: Copy cleanup + update helper scripts
            copy:
              src: "{{ item.confsrc }}"
              dest: "{{ item.confdest }}"
            with_items:
              - { confsrc: '/usr/local/src/ubuntu-24-04/opt/cloudstack/ubuntu-24-04_cleanup.sh', confdest: '/opt/cloudstack/'}
              - { confsrc: '/usr/local/src/ubuntu-24-04/opt/cloudstack/ubuntu-24-04_update.sh', confdest: '/opt/cloudstack/'}

          - name: Wire cleanup script to run on first login
            lineinfile:
              path: /root/.bashrc
              line: "chmod +x /opt/cloudstack/ubuntu-24-04_cleanup.sh && /opt/cloudstack/ubuntu-24-04_cleanup.sh"
              state: present
        always:
          - name: Restarting sshd
            shell: "sed -i 's/ForceCommand echo Please wait until the installation is completed..../#Match User anoncvs/g' /etc/ssh/sshd_config && (systemctl restart ssh 2>/dev/null || systemctl restart sshd)"
